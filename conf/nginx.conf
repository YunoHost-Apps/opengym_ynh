# openGym frontend (static, vite base './') + API proxy; any path prefix works.

# SSO walk-in login (YunoHost feature, config-panel toggle). Exact match so
# auth_header applies only here, never to the app's Bearer flows.
location = __PATH__/ynh-sso-login {
    content_by_lua_file __SSO_LUA__;
    more_set_headers 'Cache-Control: no-store';
}

# API serves /api-prefixed routes, so the prefix is kept in proxy_pass.
location ^~ __PATH__/api/ {
    client_max_body_size 48m; # exercise photo/video uploads (upstream template)
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_pass http://127.0.0.1:__PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# No rewrite here: SSOwat's access phase runs after the location rewrite phase,
# so stripping the prefix would make access.lua see "/" and portal-bounce
# anonymous visitors. alias maps the prefix instead.
location __PATH__/ {
    # slashed prefix + slashed alias: parity required, else /__PATH__../ escapes
    alias __INSTALL_DIR__/frontend/dist/;
    index index.html;
    absolute_redirect off;
    # headers-more: plain header directives don't inherit into nested locations
    more_set_headers 'X-Frame-Options: DENY';
    more_set_headers 'X-Content-Type-Options: nosniff';
    more_set_headers 'Referrer-Policy: same-origin';
    more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
    try_files $uri $uri/ __PATH__/index.html; # SPA fallback: last arg is a URI
}

# Exercise stills/clips shipped in the upstream tarball (catalogue/media/).
location __PATH__/exercise-media/ {
    alias __INSTALL_DIR__/catalogue/media/;
    expires 30d; # content-stable exercise ids, immutable (upstream)
    more_set_headers 'Cache-Control: public, max-age=2592000, immutable';
    more_set_headers 'Cross-Origin-Resource-Policy: same-origin';
    more_set_headers 'X-Content-Type-Options: nosniff';
}
